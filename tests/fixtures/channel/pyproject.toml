[project]
name = "bcn-claude-test-channel"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = [
    "aiofiles>=24.1.0",
    "bazaar-core>=0.3.0rc10,<0.4",
    "bazaar-contrib-audit>=0.3.0rc10,<0.4",
    "bazaar-contrib-channel>=0.3.0rc10,<0.4",
    "bazaar-contrib-harness>=0.3.0rc10,<0.4",
    "bazaar-contrib-timer~=0.3.0rc10",
    "mcp>=2.3.0",
    "pydantic>=2.12.0",
    "psutil>=7.0.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
test-channel-builder = "bcn_claude_test_channel:channel_builder"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
