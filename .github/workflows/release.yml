name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.3.0rc1 or 0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.commit.outputs.result }}
    steps:
      - name: Validate release source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" != *rc* && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Stable releases must run from main" >&2
            exit 1
          fi
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Prepare release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --python 3.15 --no-project scripts/release.py prepare "$RELEASE_VERSION"
      - name: Create verified release commit
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            if (!process.env.RELEASE_VERSION.includes('rc')) {
              const changelog = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '# Changelog\n\n';
              if (!changelog.includes('## ' + process.env.RELEASE_VERSION + ' - ')) {
                const previous = await exec.getExecOutput('git', ['describe', '--tags', '--abbrev=0', '--match', 'v*', '--exclude', '*rc*', context.sha], {silent: true, ignoreReturnCode: true});
                const generated = await github.rest.repos.generateReleaseNotes({
                  ...context.repo,
                  tag_name: 'v' + process.env.RELEASE_VERSION,
                  target_commitish: context.sha,
                  ...(previous.exitCode === 0 ? {previous_tag_name: previous.stdout.trim()} : {}),
                });
                const index = changelog.indexOf('\n## ');
                const offset = index < 0 ? changelog.length : index + 1;
                const section = '## ' + process.env.RELEASE_VERSION + ' - ' + new Date().toISOString().slice(0, 10);
                fs.writeFileSync('CHANGELOG.md', changelog.slice(0, offset) + section + '\n\n' + generated.data.body.trim() + '\n\n' + changelog.slice(offset));
                await exec.exec('git', ['add', '--intent-to-add', 'CHANGELOG.md']);
              }
            }
            const changed = (await exec.getExecOutput('git', ['diff', '--name-only', '-z'], {silent: true})).stdout.split('\0').filter(Boolean);
            if (changed.length === 0) return context.sha;
            const message = 'Release v' + process.env.RELEASE_VERSION;
            const {data: head} = await github.rest.repos.getBranch({...context.repo, branch: process.env.RELEASE_BRANCH});
            if (head.commit.sha !== context.sha) {
              const {data: previous} = await github.rest.repos.getCommit({...context.repo, ref: head.commit.sha});
              if (previous.parents.length !== 1 || previous.parents[0].sha !== context.sha || previous.commit.message.split('\n')[0] !== message || !previous.commit.verification.verified) {
                throw new Error('The selected branch advanced; start a new release run');
              }
              for (const path of changed) {
                const {data} = await github.rest.repos.getContent({...context.repo, path, ref: previous.sha});
                if (Buffer.from(data.content, 'base64').compare(fs.readFileSync(path)) !== 0) throw new Error('Saved release contents differ');
              }
              return previous.sha;
            }
            const input = {
              branch: {repositoryNameWithOwner: context.repo.owner + '/' + context.repo.repo, branchName: process.env.RELEASE_BRANCH},
              expectedHeadOid: context.sha,
              message: {headline: message},
              fileChanges: {additions: changed.map(path => ({path, contents: fs.readFileSync(path).toString('base64')}))},
            };
            const result = await github.graphql('mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }', {input});
            const commit = result.createCommitOnBranch.commit;
            if (!commit.signature?.isValid || !commit.signature.wasSignedByGitHub) throw new Error('Release commit is not signed and verified by GitHub');
            return commit.oid;

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.release_commit }}

  build:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout fixed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Build fixed distributions and manifest
        run: uv run --python 3.15 --no-project scripts/release.py build
      - name: Save distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist-${{ inputs.version }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Installed distributions / ${{ matrix.os }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout fixed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Download fixed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
      - name: Verify wheel and sdist installations
        run: uv run --python 3.15 --no-project scripts/release.py verify

  publish:
    needs: [prepare, build, verify]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bazaar-contrib-claude-code/${{ inputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout fixed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Download fixed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
      - name: Publish with Trusted Publishing
        run: uv run --python 3.15 --no-project scripts/release.py publish
      - name: Verify clean installation from PyPI
        run: uv run --python 3.15 --no-project scripts/release.py verify --pypi

  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout fixed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Push annotated release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="v$RELEASE_VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            epoch="$(git show -s --format=%ct HEAD)"
            GIT_COMMITTER_DATE="@$epoch +0000" git tag -a "$tag" -m "Release $tag"
          fi
          git push origin "refs/tags/$tag"
